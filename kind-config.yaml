# kind cluster for the ZT network lab: 1 control plane + 2 workers.
# The default CNI is disabled so that Cilium provides networking and policy.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ztlab
networking:
  disableDefaultCNI: true
nodes:
  - role: control-plane
    image: kindest/node:v1.30.4
  - role: worker
    image: kindest/node:v1.30.4
  - role: worker
    image: kindest/node:v1.30.4
